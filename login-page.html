<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Account portal with live Supabase announcements">
  <title>Account Portal</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #0b1020;
      --card: rgba(18, 25, 45, 0.94);
      --card-2: #121a30;
      --text: #f5f7fb;
      --muted: #9da8bd;
      --border: #29334d;
      --accent: #4f8cff;
      --accent-hover: #3b76df;
      --danger: #e05252;
      --success: #54c78b;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, #182746 0%, transparent 45%),
        var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    #announcement-bar {
      display: none;
      width: 100%;
      padding: 12px 20px;
      background: #172d52;
      border-bottom: 1px solid #31558c;
      color: #dce9ff;
      text-align: center;
      font-weight: 600;
      box-shadow: 0 4px 20px rgba(0,0,0,.18);
    }

    .container {
      width: min(440px, calc(100% - 32px));
      margin: auto;
      padding: 28px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      backdrop-filter: blur(12px);
    }

    h1, h2 { margin-top: 0; }
    h2 { text-align: center; }

    .subtitle {
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      margin: -8px 0 22px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #0d1426;
      color: var(--text);
      outline: none;
      font: inherit;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79,140,255,.12);
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px 14px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: .15s ease;
    }

    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: .55; cursor: not-allowed; }

    .btn-secondary {
      background: #28334d;
    }

    .btn-secondary:hover {
      background: #34415f;
    }

    .btn-danger {
      background: var(--danger);
    }

    .panel-box {
      padding: 16px;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
    }

    .hidden { display: none !important; }

    #status-msg {
      margin-top: 20px;
      padding: 12px;
      min-height: 42px;
      border-radius: 9px;
      background: #0d1426;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      word-break: break-word;
    }

    .section-label {
      display: block;
      margin: 18px 0 7px;
      color: #cbd3e4;
      font-size: 13px;
      font-weight: 600;
    }

    .small {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .full-width {
      width: 100%;
    }

    @media (max-width: 500px) {
      .container {
        padding: 22px;
      }

      .btn-group {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div id="announcement-bar" role="status" aria-live="polite">
    <span aria-hidden="true">📢 </span><span id="announcement-text"></span>
  </div>

  <main class="container">
    <!-- Login / Register -->
    <section id="auth-zone">
      <h2>Account Portal</h2>
      <p class="subtitle">Users and administrators log in here.</p>

      <input
        type="email"
        id="email"
        autocomplete="email"
        placeholder="Email address"
      >

      <input
        type="password"
        id="password"
        autocomplete="current-password"
        placeholder="Password"
      >

      <div class="btn-group">
        <button id="loginBtn" type="button">Log In</button>
        <button id="signupBtn" class="btn-secondary" type="button">Register</button>
      </div>

      <p class="small" style="margin-bottom:0;">
        New accounts may need to verify their email before logging in.
      </p>
    </section>

    <!-- User Dashboard -->
    <section id="user-dashboard" class="hidden">
      <h2>User Dashboard</h2>

      <div class="panel-box">
        <p>Welcome back, <strong id="user-email-display">Member</strong>!</p>
        <p class="small">
          Your Supabase session is active.
        </p>
      </div>

      <br>
      <button id="userLogoutBtn" class="btn-secondary full-width" type="button">
        Sign Out
      </button>
    </section>

    <!-- Admin Dashboard -->
    <section id="admin-dashboard" class="hidden">
      <h2>Admin Command Panel</h2>

      <div class="panel-box" style="border-left-color:#ff9800; margin-bottom:20px;">
        <p>
          Logged in as administrator:
          <strong id="admin-email-display">Admin</strong>
        </p>
      </div>

      <label class="section-label" for="alertInput">
        Live Global Announcement
      </label>

      <input
        type="text"
        id="alertInput"
        maxlength="500"
        placeholder="Type an announcement..."
      >

      <div class="btn-group">
        <button id="broadcastBtn" type="button">Broadcast Live</button>
        <button id="clearBtn" class="btn-secondary" type="button">Clear Banner</button>
      </div>

      <br>
      <button id="adminLogoutBtn" class="btn-danger full-width" type="button">
        Sign Out
      </button>
    </section>

    <div id="status-msg" role="status" aria-live="polite">
      [SYSTEM REPORT]: Starting...
    </div>
  </main>

  <script type="module" src="login-auth.js"></script>
</body>
</html>
